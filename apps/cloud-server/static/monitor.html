<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi 视频流监控系统</title>
    <!-- 引入 React 和 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .scroll-hide::-webkit-scrollbar { width: 4px; }
        .scroll-hide::-webkit-scrollbar-track { background: transparent; }
        .scroll-hide::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
        }
        canvas { width: 100%; height: 100%; object-fit: contain; }
        /* Fix Leaflet z-index to not overlap modals if any */
        .leaflet-container { z-index: 0; background: #1e293b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Video Component ---
        const VideoPlayer = ({ frameData, fps }) => {
            const canvasRef = useRef(null);
            useEffect(() => {
                if (frameData && canvasRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    const img = new Image();
                    img.onload = () => {
                        if (canvasRef.current.width !== img.width) {
                            canvasRef.current.width = img.width;
                            canvasRef.current.height = img.height;
                        }
                        ctx.drawImage(img, 0, 0);
                    };
                    img.src = frameData.startsWith('data:image/') ? frameData : `data:image/jpeg;base64,${frameData}`;
                }
            }, [frameData]);

            return (
                <div className="w-full h-full bg-black flex flex-col items-center justify-center relative group">
                    <div className="absolute top-4 left-4 z-10 bg-black/50 px-2 py-1 rounded text-green-400 font-mono text-sm">FPS: {fps}</div>
                    {frameData ? (
                        <canvas ref={canvasRef} className="max-w-full max-h-full"></canvas>
                    ) : (
                        <div className="text-gray-500 flex flex-col items-center">
                            <svg className="w-12 h-12 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-.947.894l-4.553-2.276v-.442l-.001-.442H15V10zM5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            <span>等待视频信号...</span>
                        </div>
                    )}
                </div>
            );
        };

        // --- Map Component (AMap Iframe) ---
        const MapComponent = () => {
            return (
                <div className="w-full h-full relative">
                    <iframe 
                        src="/static/amap_nav.html" 
                        className="w-full h-full border-0"
                        title="Real-time Map"
                    />
                    <div className="absolute top-2 right-2 z-[400] bg-black/70 text-white text-xs px-2 py-1 rounded pointer-events-none">
                        高德地图 (实时)
                    </div>
                </div>
            );
        };

        // --- AI Terminal Component ---
        const AITerminal = ({ messages, onSendMessage }) => {
            const endRef = useRef(null);
            const [input, setInput] = useState('');
            useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
            const handleSubmit = (e) => { e.preventDefault(); if(input.trim()) { onSendMessage(input); setInput(''); } };

            return (
                <div className="flex flex-col h-full bg-gray-900 border-l border-gray-700">
                    <div className="p-2 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                        <span className="text-xs font-bold text-gray-300">AI 交互终端</span>
                        <span className="text-[10px] text-gray-500 font-mono">/bin/bash</span>
                    </div>
                    <div className="flex-1 overflow-y-auto p-3 space-y-4 scroll-hide font-mono text-xs">
                        {messages.length === 0 && <div className="text-gray-600 text-center mt-10">终端就绪...</div>}
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex flex-col ${msg.type === 'user' ? 'items-end' : 'items-start'}`}>
                                <div className={`max-w-[90%] rounded p-2 ${
                                    msg.type === 'user' ? 'bg-blue-900/40 text-blue-200 border-r-2 border-blue-500' :
                                    msg.type === 'ai_text' ? 'bg-purple-900/40 text-purple-300 border-l-2 border-purple-500' :
                                    msg.type === 'assistant_reply' ? 'bg-purple-900/40 text-purple-300 border-l-2 border-purple-500' :
                                    msg.type === 'asr_update' ? 'text-yellow-400 italic bg-yellow-900/20 border-l-2 border-yellow-500' :
                                    msg.type === 'ai' ? 'bg-gray-800 text-green-300 border-l-2 border-green-500' :
                                    'text-gray-500 italic bg-gray-900/10'
                                }`}>
                                    <div className="text-[10px] opacity-50 mb-1 flex justify-between gap-2">
                                        <span>{msg.type.toUpperCase()}</span>
                                        <span>{msg.time}</span>
                                    </div>
                                    <div className="whitespace-pre-wrap leading-relaxed">{msg.text}</div>
                                </div>
                            </div>
                        ))}
                        <div ref={endRef}></div>
                    </div>
                    <form onSubmit={handleSubmit} className="p-2 bg-black/30 border-t border-gray-700 flex gap-2">
                        <input
                            value={input}
                            onChange={e=>setInput(e.target.value)}
                            className="flex-1 bg-gray-800 rounded px-2 py-1 text-xs text-white outline-none focus:ring-1 focus:ring-blue-500"
                            placeholder="输入指令..."
                        />
                        <button type="submit" className="px-3 py-1 bg-blue-700 hover:bg-blue-600 rounded text-xs text-white font-bold">发送</button>
                    </form>
                </div>
            );
        };

        const RecognitionPanel = ({ recognitionItems, voiceState }) => {
            const latestItem = recognitionItems.length > 0 ? recognitionItems[recognitionItems.length - 1] : null;
            const historyItems = recognitionItems.length > 1 ? recognitionItems.slice(0, -1).reverse() : [];
            return (
                <div className="flex flex-col h-full bg-gray-900 border-l border-gray-700">
                    <div className="p-2 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                        <span className="text-xs font-bold text-gray-300">实时识别结果</span>
                        <span className="text-[10px] text-gray-500 font-mono">recognition</span>
                    </div>
                    <div className="flex-1 overflow-y-auto p-3 space-y-3 scroll-hide font-mono text-xs">
                        <div className="rounded border border-cyan-500/30 bg-cyan-900/20 p-2 text-cyan-100">
                            <div className="flex justify-between gap-2 text-[10px] opacity-80 mb-1">
                                <span>语音模式</span>
                                <span>{voiceState.time || '--'}</span>
                            </div>
                            <div className="flex items-center justify-between gap-2">
                                <span className={`text-sm font-bold ${voiceState.mode === 'awake' ? 'text-amber-300' : 'text-sky-300'}`}>{voiceState.mode || 'unknown'}</span>
                                <span className="text-[10px] text-cyan-200">{voiceState.remaining > 0 ? `${voiceState.remaining}s` : 'idle'}</span>
                            </div>
                            <div className="mt-1 text-[10px] text-cyan-200/80">event: {voiceState.event || 'init'}</div>
                            {voiceState.text && <div className="mt-1 text-[10px] text-cyan-100/80">text: {voiceState.text}</div>}
                        </div>
                        {!latestItem && <div className="text-gray-600 text-center mt-10">等待识别结果...</div>}
                        {latestItem && (
                            <div className="rounded-lg p-3 bg-emerald-900/35 text-emerald-200 border border-emerald-500/40 shadow-sm">
                                <div className="text-[10px] opacity-70 mb-2 flex justify-between gap-2">
                                    <span>当前最新结果 · {latestItem.clientId || 'global'}</span>
                                    <span>{latestItem.time}</span>
                                </div>
                                <div className="whitespace-pre-wrap leading-relaxed text-sm font-semibold">{latestItem.text}</div>
                            </div>
                        )}
                        {historyItems.map((item, idx) => (
                            <div key={idx} className="rounded p-2 bg-emerald-900/20 text-emerald-300 border-l-2 border-emerald-500">
                                <div className="text-[10px] opacity-50 mb-1 flex justify-between gap-2">
                                    <span>{item.clientId || 'RECOGNITION'}</span>
                                    <span>{item.time}</span>
                                </div>
                                <div className="whitespace-pre-wrap leading-relaxed">{item.text}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Status Component ---
        const StatusPanel = ({ signal, isConnected, logs, voiceState }) => {
            return (
                <div className="h-full bg-gray-900 border-l border-t border-gray-700 flex flex-col">
                    <div className="p-2 bg-gray-800 border-b border-gray-700 text-xs font-bold text-gray-300">系统状态 & 日志</div>
                    <div className="p-3 grid grid-cols-3 gap-3 border-b border-gray-800">
                        <div className="bg-gray-800 rounded p-2 text-center">
                            <div className="text-[10px] text-gray-400">服务连接</div>
                            <div className={`text-sm font-bold ${isConnected ? 'text-green-400' : 'text-red-400'}`}>{isConnected ? '在线' : '断开'}</div>
                        </div>
                        <div className="bg-gray-800 rounded p-2 text-center">
                            <div className="text-[10px] text-gray-400">信号强度</div>
                            <div className="text-sm font-bold text-blue-400">{signal}%</div>
                        </div>
                        <div className="bg-gray-800 rounded p-2 text-center">
                            <div className="text-[10px] text-gray-400">语音状态</div>
                            <div className={`text-sm font-bold ${voiceState.mode === 'awake' ? 'text-amber-400' : 'text-cyan-400'}`}>{voiceState.mode || 'unknown'}</div>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-2 space-y-1 scroll-hide font-mono text-[10px]">
                        {logs.map((log, i) => (
                            <div key={i} className="text-gray-400 border-b border-gray-800 pb-1 last:border-0">
                                <span className="text-gray-600">[{log.time}]</span> {log.text}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [isConnected, setIsConnected] = useState(false);
            const [frameData, setFrameData] = useState(null);
            const [signal, setSignal] = useState(0);
            const [fps, setFps] = useState(0);
            const [logs, setLogs] = useState([]);
            const [aiMessages, setAiMessages] = useState([]);
            const [recognitionItems, setRecognitionItems] = useState([]);
            const [voiceState, setVoiceState] = useState({ mode: 'standby', event: 'init', remaining: 0, text: '', time: '' });
            const [currentMode, setCurrentMode] = useState('monitor');
            const [cameraSource, setCameraSource] = useState('local');
            const [hasRoute, setHasRoute] = useState(false); // Add route status

            // WS Logic
            const frameCountRef = useRef(0);
            const lastFpsTimeRef = useRef(Date.now());
            const clientIdRef = useRef(null);

            useEffect(() => {
                // Get client_id from URL params
                const urlParams = new URLSearchParams(window.location.search);
                const clientId = urlParams.get('client_id');
                clientIdRef.current = clientId;

                // Use relative path for robustness
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                // Append client_id if present to filter stream
                const wsUrl = `${protocol}//${window.location.host}/ws/stream${clientId ? `?client_id=${clientId}` : ''}`;
                console.log("Connecting to:", wsUrl);

                const ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    setIsConnected(true);
                    // Add initial log
                    setLogs(p => [...p, {time: new Date().toLocaleTimeString(), text: `Connected to server (${clientId || 'Global Stream'})`}]);
                };
                ws.onclose = () => setIsConnected(false);
                ws.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        const scopedClientId = clientIdRef.current;
                        const shouldConsume = !scopedClientId || !data.client_id || data.client_id === scopedClientId;
                        if (!shouldConsume) return;

                        if (data.frame) setFrameData(data.frame);
                        if (data.signal) setSignal(data.signal);
                        const applyVoiceState = (next) => {
                            setVoiceState(prev => ({
                                ...prev,
                                mode: next.voice_mode || prev.mode,
                                event: next.voice_last_event || prev.event,
                                remaining: typeof next.voice_awake_remaining === 'number' ? next.voice_awake_remaining : prev.remaining,
                                text: next.voice_last_text || next.voice_last_routed_text || next.voice_last_ignored_text || prev.text,
                                time: new Date().toLocaleTimeString(),
                            }));
                        };
                        if (data.voice_mode || data.voice_last_event) {
                            applyVoiceState(data);
                        }
                        if (data.type === 'voice_state') {
                            applyVoiceState(data);
                            setLogs(p => [...p, {time: new Date().toLocaleTimeString(), text: `[voice] ${data.voice_mode || 'unknown'} / ${data.voice_last_event || 'event'}${data.voice_last_text ? ` / ${data.voice_last_text}` : ''}`}].slice(-80));
                        }
                        if (data.type === 'recognition_update' && data.text) {
                            setRecognitionItems(p => {
                                const next = [...p, {text: data.text, clientId: data.client_id || 'global', time: new Date().toLocaleTimeString()}];
                                const deduped = next.filter((item, idx, arr) => idx === 0 || item.text !== arr[idx - 1].text || item.clientId !== arr[idx - 1].clientId);
                                return deduped.slice(-30);
                            });
                            setLogs(p => [...p, {time: new Date().toLocaleTimeString(), text: `[recognition] ${data.text}${data.voice_mode ? ` [${data.voice_mode}]` : ''}`}].slice(-80));
                        }
                        if (data.type === 'ai_text') {
                            setAiMessages(p => [...p, {type: 'ai_text', text: data.ai_response, time: new Date().toLocaleTimeString()}].slice(-50));
                        }
                        if (data.type === 'assistant_reply') {
                            setAiMessages(p => [...p, {type: 'assistant_reply', text: data.text, time: new Date().toLocaleTimeString()}].slice(-50));
                            setLogs(p => [...p, {time: new Date().toLocaleTimeString(), text: `[assistant_reply] ${data.text}`}].slice(-80));
                        }
                        if (data.type === 'asr_update') {
                            setAiMessages(p => [...p, {type: 'asr_update', text: `ASR: ${data.asr_text}`, time: new Date().toLocaleTimeString()}].slice(-50));
                            setLogs(p => [...p, {time: new Date().toLocaleTimeString(), text: `[asr] ${data.asr_text}${data.voice_mode ? ` [${data.voice_mode}]` : ''}`}].slice(-80));
                        }
                        if (data.type === 'ai_terminal_output') {
                            setAiMessages(p => [...p, {type: 'ai', text: data.text, time: new Date().toLocaleTimeString()}].slice(-50));
                        }
                        if (data.type === 'route_update') {
                            setHasRoute(Boolean(data.route && data.route.length));
                            const dest = data.destination_name ? ` -> ${data.destination_name}` : '';
                            const stepText = typeof data.current_step_index === 'number' ? ` / step ${data.current_step_index}` : '';
                            setAiMessages(p => [...p, {type: 'ai', text: `📍 收到真实路线更新${dest}${data.instruction_text ? ` / ${data.instruction_text}` : ''}`, time: new Date().toLocaleTimeString()}].slice(-50));
                            setLogs(p => [...p, {time: new Date().toLocaleTimeString(), text: `[route] 节点 ${data.route ? data.route.length : 0}${dest}${stepText}${data.coord_system ? ` [${data.coord_system}]` : ''}`}].slice(-80));
                        }
                        if (data.type === 'navigation_instruction' && data.text) {
                            setAiMessages(p => [...p, {type: 'ai', text: `导航: ${data.text}`, time: new Date().toLocaleTimeString()}].slice(-50));
                            setLogs(p => [...p, {time: new Date().toLocaleTimeString(), text: `[navigation_instruction] ${data.text}`}].slice(-80));
                        }

                        if (data.frame) {
                            frameCountRef.current++;
                            if(Date.now() - lastFpsTimeRef.current >= 1000) {
                                setFps(frameCountRef.current);
                                frameCountRef.current = 0;
                                lastFpsTimeRef.current = Date.now();
                            }
                        }
                    } catch(err){}
                };
                return () => { ws.close(); };
            }, []);

            const handleSetMode = (mode) => {
                setCurrentMode(mode);
                fetch('/api/set_mode', { method: 'POST', body: JSON.stringify({mode}), headers: {'Content-Type': 'application/json'} });
            };
            const handleSetSource = (source) => {
                setCameraSource(source);
                fetch('/api/set_source', { method: 'POST', body: JSON.stringify({source}), headers: {'Content-Type': 'application/json'} });
            };
            const handleSendMessage = (text) => {
                setAiMessages(p => [...p, {type:'user', text, time: new Date().toLocaleTimeString()}].slice(-50));
            };

            return (
                <div className="h-screen flex flex-col overflow-hidden">
                    {/* Header */}
                    <div className="h-12 bg-gray-900 border-b border-gray-700 flex items-center justify-between px-4 shrink-0">
                        <div className="flex items-center gap-2">
                            <div className="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                            <h1 className="font-bold text-lg tracking-tight">OmniVision Console</h1>
                        </div>
                    </div>

                    {/* Main Content (3-Panel Layout: Video | Map | Sidebar) */}
                    <div className="flex-1 flex overflow-hidden">

                        {/* 1. Video Panel (Main Focus) - 75% Width */}
                        <div className="flex-1 bg-black relative border-r border-gray-700">
                            <VideoPlayer frameData={frameData} fps={fps} />
                        </div>

                        {/* 3. Sidebar (Terminal & Logs) - 25% Width */}
                        <div className="w-1/4 flex flex-col shrink-0 min-w-[280px]">
                            <div className="overflow-hidden h-[42%] border-l border-gray-700">
                                <AITerminal messages={aiMessages} onSendMessage={handleSendMessage} />
                            </div>
                            <div className="overflow-hidden h-[23%] min-h-[140px] border-l border-t border-gray-700">
                                <RecognitionPanel recognitionItems={recognitionItems} voiceState={voiceState} />
                            </div>
                            <div className="h-[35%] min-h-[150px] border-l border-t border-gray-700">
                                <StatusPanel signal={signal} isConnected={isConnected} logs={logs} voiceState={voiceState} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
