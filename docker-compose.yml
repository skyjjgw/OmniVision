services:
  cloud-backend:
    build: ./apps/cloud-server
    container_name: omnivision-cloud-backend
    working_dir: /app
    command: uvicorn backend:app --host 0.0.0.0 --port 8000
    env_file:
      - ./shared/config/cloud.env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/cloud-server/uploads:/app/uploads
    restart: unless-stopped

  cloud-signaling:
    build: ./apps/cloud-server
    container_name: omnivision-cloud-signaling
    working_dir: /app
    command: python signaling_server.py
    env_file:
      - ./shared/config/cloud.env
    ports:
      - "6000:6000"
    depends_on:
      - cloud-backend
    restart: unless-stopped
